name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out mat-data-handler
        uses: actions/checkout@v4

      - name: Check out mat-data (test fixture data)
        uses: actions/checkout@v4
        with:
          repository: ICAMS/mat-data
          # Pin to a released tag for reproducibility once available, e.g. ref: v2026.9.0
          ref: main
          path: mat-data-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[test]"

      - name: Validate mat-data entries
        env:
          MAT_DATA_LOCAL_PATH: ${{ github.workspace }}/mat-data-checkout
        run: mat-build-database --output /tmp/materials.yaml --validate-only

      - name: Rebuild database and check reproducibility
        env:
          MAT_DATA_LOCAL_PATH: ${{ github.workspace }}/mat-data-checkout
        run: |
          mat-build-database --output /tmp/materials.yaml
          mat-build-database --output /tmp/materials.yaml --check

      - name: Run tests
        env:
          MAT_DATA_LOCAL_PATH: ${{ github.workspace }}/mat-data-checkout
        run: pytest -v

      - name: Export a sample material
        env:
          MAT_DATA_LOCAL_PATH: ${{ github.workspace }}/mat-data-checkout
        run: mat-extract-params copper_generic --outdir /tmp/includes
