[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mat-data-handler"
version = "0.1.0"
description = "Validate, combine, and export crystal-plasticity material parameter sets for ICAMS CP-UMAT."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ICAMS, Ruhr University Bochum" }]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
]
# Note: material data is NOT a pip/conda dependency. It is fetched at runtime
# from the separate https://github.com/ICAMS/mat-data repository and cached
# locally; see mat_data_handler.data_source. Requires network access on first
# use (or MAT_DATA_LOCAL_PATH pointing at a local checkout for offline use).
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mat-build-database = "mat_data_handler.database:main"
mat-extract-params = "mat_data_handler.extract:main"

[project.urls]
Homepage = "https://github.com/ICAMS/mat-data-handler"
Repository = "https://github.com/ICAMS/mat-data-handler"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_data_handler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
