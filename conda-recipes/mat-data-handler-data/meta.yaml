{% set name = "mat-data-handler-data" %}
{% set version = "2026.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # sha256: <fill in after the first PyPI release>

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - pip
    - hatchling
  run:
    - python >=3.9

test:
  imports:
    - mat_data_handler_data

about:
  home: https://github.com/<org>/mat-data-handler
  license: MIT
  license_file: LICENSE
  summary: Validated crystal-plasticity material parameter sets for mat-data-handler.

extra:
  recipe-maintainers:
    - <github-username>
