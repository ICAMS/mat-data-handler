[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mat-data-handler"
version = "0.1.0"
description = "Validate, combine, and export crystal-plasticity material parameter sets for Abaqus UMATs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ICAMS, Ruhr University Bochum" }]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "mat-data-handler-data>=2026.9,<2027",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mat-build-database = "mat_data_handler.database:main"
mat-extract-params = "mat_data_handler.extract:main"

[project.urls]
Homepage = "https://github.com/<org>/mat-data-handler"
Repository = "https://github.com/<org>/mat-data-handler"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_data_handler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
