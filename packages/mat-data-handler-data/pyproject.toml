[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mat-data-handler-data"
version = "2026.9.0"
description = "Validated crystal-plasticity material parameter sets (YAML entries, JSON schemas, PROPS mapping) for mat-data-handler."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ICAMS, Ruhr University Bochum" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/<org>/mat-data-handler"
Repository = "https://github.com/<org>/mat-data-handler"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_data_handler_data"]
# hatchling includes all non-ignored files under the package directory by
# default, so entries/*.yaml, schemas/*.json, and mapping.csv ship with the wheel.
